<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063c3b">
<title>نور المسلم</title>

<style>
:root{
  --bg:#032f31;
  --bg2:#064b49;
  --gold:#e9c45b;
  --gold2:#f6dfa0;
  --cream:#fff8e8;
  --text:#173b38;
  --muted:#8db4ae;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#021f21;
  color:#fff;
  font-family:Tahoma,Arial,sans-serif;
}

.app{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:
    radial-gradient(
      circle at 50% 0,
      #0c5a57 0,
      #063c3b 32%,
      #022c2e 75%
    );
  overflow:hidden;
}

header{
  padding:18px 18px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.icon{
  width:40px;
  height:40px;
  border:1px solid #c9ad51;
  border-radius:12px;
  background:#063b3b;
  color:var(--gold);
  font-size:20px;
}

.brand{
  font-size:23px;
  font-weight:700;
  color:var(--gold2);
}

.hero{
  margin:6px 14px 12px;
  padding:24px 18px;
  border:1px solid #b99b3e;
  border-radius:24px;
  text-align:center;
  background:
    linear-gradient(
      145deg,
      rgba(7,72,70,.9),
      rgba(2,40,42,.95)
    );
}

.hero h1{
  font-size:32px;
  margin:4px 0;
  color:var(--gold2);
}

.hero p{
  margin:4px 0;
  color:#fff4d0;
  font-size:13px;
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0 14px;
}

.card{
  background:
    linear-gradient(
      145deg,
      #fdf6e6,
      #eee3ca
    );
  color:var(--text);
  border-radius:18px;
  padding:14px;
  border:1px solid #d5b95e;
  min-height:105px;
}

.card small{
  display:block;
  color:#58716c;
}

.card strong{
  display:block;
  font-size:26px;
  margin:8px 0;
}

.next{
  background:
    linear-gradient(
      145deg,
      #095955,
      #063f3e
    );
  color:#fff;
  border:1px solid #d5b95e;
}

.next small{
  color:#f4e3aa;
}

.next strong{
  color:#ffe29a;
}

.title{
  padding:18px 16px 9px;
  font-size:17px;
  color:var(--gold2);
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  padding:0 14px;
}

.quick{
  min-height:90px;
  border:1px solid #a89046;
  border-radius:16px;
  background:#053d3c;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:13px;
}

.quick b{
  font-size:27px;
  color:var(--gold);
}

.location{
  margin:14px;
  background:#064946;
  border:1px solid #8f7b39;
  border-radius:16px;
  padding:13px;
  text-align:center;
  color:#d9eee9;
  font-size:13px;
}

nav{
  position:sticky;
  bottom:0;
  background:rgba(2,37,39,.97);
  border-top:1px solid #75652f;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:
    8px
    6px
    calc(8px + env(safe-area-inset-bottom));
}

nav button{
  background:none;
  border:0;
  color:#c7d8d3;
  font-size:11px;
}

nav b{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

nav .active{
  color:var(--gold);
}

.toast{
  position:fixed;
  bottom:78px;
  left:50%;
  transform:translateX(-50%);
  background:#fff5df;
  color:#173b38;
  padding:11px 16px;
  border-radius:14px;
  display:none;
  z-index:5;
  box-shadow:0 8px 30px #0006;
}
</style>
</head>

<body>

<div class="app">

<header>

<button
  class="icon"
  onclick="notify('الإعدادات ستُدار من لوحة التحكم')">
  ⚙
</button>

<div class="brand">
  نور المسلم
</div>

<button
  class="icon"
  onclick="notify('لا توجد إشعارات جديدة')">
  ♧
</button>

</header>


<section class="hero">

<div style="font-size:38px">
  ☪
</div>

<h1>
  نور المسلم
</h1>

<p>
  طريقك إلى الراحة والطمأنينة
</p>

</section>


<section class="cards">

<div class="card next">

<small>
  الصلاة القادمة
</small>

<strong id="nextName">
  الظهر
</strong>

<div id="nextTime">
  12:59
</div>

</div>


<div class="card">

<small>
  الوقت الحالي
</small>

<strong id="clock">
  --:--
</strong>

<div id="today">
  --
</div>

</div>

</section>


<div class="title">
  الوصول السريع
</div>


<section class="grid">

<button
  class="quick"
  onclick="notify('قسم مواقيت الصلاة')">

  <b>🕌</b>

  مواقيت الصلاة

</button>


<button
  class="quick"
  onclick="notify('قسم القرآن الكريم')">

  <b>📖</b>

  القرآن الكريم

</button>


<button
  class="quick"
  onclick="notify('قسم التسبيح')">

  <b>📿</b>

  التسبيح

</button>


<button
  class="quick"
  onclick="notify('قسم الأذكار')">

  <b>🤲</b>

  الأذكار

</button>


<button
  class="quick"
  onclick="notify('قسم القبلة')">

  <b>🧭</b>

  القبلة

</button>


<button
  class="quick"
  onclick="notify('المزيد من الأقسام')">

  <b>▦</b>

  المزيد

</button>

</section>


<div
  class="location"
  id="location">

  📍 جاري تحديد المدينة...

</div>


<nav>

<button class="active">

<b>⌂</b>

الرئيسية

</button>


<button
  onclick="notify('القرآن')">

<b>▤</b>

القرآن

</button>


<button
  onclick="notify('الأذكار')">

<b>♨</b>

الأذكار

</button>


<button
  onclick="notify('المزيد')">

<b>⊞</b>

المزيد

</button>

</nav>

</div>


<div
  class="toast"
  id="toast">
</div>


<script>

const prayers = [

  ['الفجر','04:48'],

  ['الشروق','06:17'],

  ['الظهر','12:59'],

  ['العصر','16:36'],

  ['المغرب','19:03'],

  ['العشاء','20:27']

];


function tick(){

  const d = new Date();


  document
    .getElementById('clock')
    .textContent =
      d.toLocaleTimeString(
        'ar-EG',
        {
          hour:'2-digit',
          minute:'2-digit'
        }
      );


  document
    .getElementById('today')
    .textContent =
      d.toLocaleDateString(
        'ar-EG',
        {
          weekday:'long',
          day:'numeric',
          month:'long'
        }
      );


  const currentMinutes =
    d.getHours() * 60 +
    d.getMinutes();


  let found =
    prayers.find(
      p => {

        const parts =
          p[1].split(':')
            .map(Number);

        return (
          parts[0] * 60 +
          parts[1]
        ) > currentMinutes;

      }
    );


  if(!found){

    found = prayers[0];

  }


  document
    .getElementById('nextName')
    .textContent = found[0];


  document
    .getElementById('nextTime')
    .textContent = found[1];

}


function notify(text){

  const toast =
    document.getElementById('toast');

  toast.textContent = text;

  toast.style.display = 'block';

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(
      () => {
        toast.style.display = 'none';
      },
      1800
    );

}


function getLocation(){

  if(!navigator.geolocation){

    document
      .getElementById('location')
      .textContent =
        '📍 اختر المدينة من لوحة التحكم';

    return;

  }


  navigator.geolocation.getCurrentPosition(

    () => {

      document
        .getElementById('location')
        .textContent =
          '📍 تم تحديد موقعك لمواقيت الصلاة';

    },

    () => {

      document
        .getElementById('location')
        .textContent =
          '📍 اختر المدينة من إعدادات التطبيق';

    }

  );

}


tick();

setInterval(
  tick,
  1000
);

getLocation();

</script>

</body>
  </html>
