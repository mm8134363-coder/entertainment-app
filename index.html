<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>بنت تجمع العملات</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #17152b;
  font-family: Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    linear-gradient(#6ec6ff 0%, #b8edff 65%, #72d572 65%, #45a845 100%);
}

/* الشمس */
#sun {
  position: absolute;
  width: 75px;
  height: 75px;
  border-radius: 50%;
  background: #ffd83d;
  top: 45px;
  right: 35px;
  box-shadow: 0 0 30px #ffe88a;
}

/* السحب */
.cloud {
  position: absolute;
  width: 100px;
  height: 35px;
  background: white;
  border-radius: 40px;
  opacity: .9;
}

.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  background: white;
  border-radius: 50%;
}

.cloud::before {
  width: 45px;
  height: 45px;
  left: 15px;
  top: -20px;
}

.cloud::after {
  width: 55px;
  height: 55px;
  right: 10px;
  top: -28px;
}

.c1 {
  top: 90px;
  left: 10%;
}

.c2 {
  top: 170px;
  left: 55%;
  transform: scale(.8);
}

/* لوحة المعلومات */
#info {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.box {
  background: rgba(0,0,0,.65);
  color: white;
  padding: 10px 15px;
  border-radius: 15px;
  font-size: 18px;
  font-weight: bold;
}

/* البنت */
#girl {
  position: absolute;
  width: 70px;
  height: 105px;
  bottom: 90px;
  left: calc(50% - 35px);
  z-index: 10;
}

/* الرأس */
.head {
  position: absolute;
  width: 48px;
  height: 48px;
  background: #ffd0b0;
  border-radius: 50%;
  top: 0;
  left: 11px;
  z-index: 3;
}

/* الشعر */
.hair {
  position: absolute;
  width: 53px;
  height: 55px;
  background: #542b1f;
  border-radius: 50% 50% 45% 45%;
  top: -5px;
  left: 8px;
  z-index: 2;
}

.hair::after {
  content: "";
  position: absolute;
  width: 17px;
  height: 48px;
  background: #542b1f;
  right: -7px;
  top: 20px;
  border-radius: 20px;
}

/* العين */
.eye {
  position: absolute;
  width: 5px;
  height: 7px;
  background: #222;
  border-radius: 50%;
  top: 22px;
  z-index: 5;
}

.eye1 {
  left: 23px;
}

.eye2 {
  left: 38px;
}

/* الجسم */
.body {
  position: absolute;
  width: 48px;
  height: 48px;
  background: #ff5f9e;
  top: 43px;
  left: 11px;
  border-radius: 15px 15px 8px 8px;
}

/* الذراع */
.arm {
  position: absolute;
  width: 12px;
  height: 38px;
  background: #ffd0b0;
  border-radius: 10px;
  top: 48px;
  z-index: 1;
}

.arm1 {
  left: 3px;
  transform: rotate(20deg);
}

.arm2 {
  right: 3px;
  transform: rotate(-20deg);
}

/* الرجل */
.leg {
  position: absolute;
  width: 13px;
  height: 30px;
  background: #ffd0b0;
  bottom: 0;
  border-radius: 10px;
}

.leg1 {
  left: 17px;
}

.leg2 {
  right: 17px;
}

/* العملة */
.coin {
  position: absolute;
  width: 35px;
  height: 35px;
  background: #ffd21c;
  border: 4px solid #e7a900;
  border-radius: 50%;
  z-index: 5;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}

.coin::after {
  content: "★";
  position: absolute;
  color: #fff1a0;
  font-size: 18px;
  left: 6px;
  top: 3px;
}

/* زر البداية */
#startScreen {
  position: absolute;
  inset: 0;
  background: rgba(20,15,45,.9);
  z-index: 100;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  text-align: center;
}

#startScreen h1 {
  font-size: 34px;
  margin-bottom: 10px;
}

#startScreen p {
  font-size: 18px;
  margin-bottom: 25px;
}

button {
  border: 0;
  background: #ff4f91;
  color: white;
  padding: 15px 35px;
  border-radius: 30px;
  font-size: 20px;
  font-weight: bold;
  box-shadow: 0 5px 15px rgba(0,0,0,.3);
}

button:active {
  transform: scale(.95);
}

/* أزرار الحركة */
#controls {
  position: absolute;
  bottom: 15px;
  left: 15px;
  right: 15px;
  z-index: 30;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

.control {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: rgba(0,0,0,.55);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 35px;
  pointer-events: auto;
  user-select: none;
}

/* رسالة النهاية */
#gameOver {
  position: absolute;
  inset: 0;
  background: rgba(15,10,30,.9);
  z-index: 90;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
  text-align: center;
}

#gameOver h2 {
  font-size: 35px;
  margin: 10px;
}

#gameOver p {
  font-size: 20px;
}
</style>
</head>

<body>

<div id="game">

  <div id="sun"></div>

  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <div id="info">
    <div class="box">🪙 العملات: <span id="score">0</span></div>
    <div class="box">❤️ <span id="lives">3</span></div>
  </div>

  <!-- البنت -->
  <div id="girl">

    <div class="hair"></div>

    <div class="head">
      <div class="eye eye1"></div>
      <div class="eye eye2"></div>
    </div>

    <div class="arm arm1"></div>
    <div class="arm arm2"></div>

    <div class="body"></div>

    <div class="leg leg1"></div>
    <div class="leg leg2"></div>

  </div>

  <!-- أزرار الحركة -->
  <div id="controls">
    <div class="control" id="right">➡️</div>
    <div class="control" id="left">⬅️</div>
  </div>

  <!-- شاشة البداية -->
  <div id="startScreen">
    <h1>👧 مغامرة البنت</h1>
    <p>حرّك البنت واجمع العملات 🪙</p>
    <button onclick="startGame()">ابدأ اللعبة</button>
  </div>

  <!-- شاشة النهاية -->
  <div id="gameOver">
    <h2>انتهت اللعبة 😢</h2>
    <p>مجموع العملات: <span id="finalScore">0</span></p>
    <button onclick="restartGame()">العب مرة أخرى</button>
  </div>

</div>

<script>

let gameRunning = false;

let score = 0;
let lives = 3;

let girlX = window.innerWidth / 2 - 35;

let moveLeft = false;
let moveRight = false;

let coins = [];

const girl = document.getElementById("girl");
const game = document.getElementById("game");

const scoreText = document.getElementById("score");
const livesText = document.getElementById("lives");

const leftButton = document.getElementById("left");
const rightButton = document.getElementById("right");

/* بدء اللعبة */
function startGame() {

  document.getElementById("startScreen").style.display = "none";

  score = 0;
  lives = 3;

  scoreText.textContent = score;
  livesText.textContent = lives;

  girlX = window.innerWidth / 2 - 35;

  gameRunning = true;

  createCoin();
}

/* إعادة اللعبة */
function restartGame() {

  document.getElementById("gameOver").style.display = "none";

  coins.forEach(c => c.element.remove());
  coins = [];

  startGame();
}

/* حركة البنت */
function updateGirl() {

  if (!gameRunning) return;

  if (moveLeft) {
    girlX -= 6;
  }

  if (moveRight) {
    girlX += 6;
  }

  const maxX = window.innerWidth - 70;

  if (girlX < 0) {
    girlX = 0;
  }

  if (girlX > maxX) {
    girlX = maxX;
  }

  girl.style.left = girlX + "px";
}

/* زر اليسار */
leftButton.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveLeft = true;
});

leftButton.addEventListener("touchend", function(e) {
  e.preventDefault();
  moveLeft = false;
});

leftButton.addEventListener("mousedown", function() {
  moveLeft = true;
});

leftButton.addEventListener("mouseup", function() {
  moveLeft = false;
});

/* زر اليمين */
rightButton.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveRight = true;
});

rightButton.addEventListener("touchend", function(e) {
  e.preventDefault();
  moveRight = false;
});

rightButton.addEventListener("mousedown", function() {
  moveRight = true;
});

rightButton.addEventListener("mouseup", function() {
  moveRight = false;
});

/* إنشاء عملة */
function createCoin() {

  if (!gameRunning) return;

  const element = document.createElement("div");

  element.className = "coin";

  const x = Math.random() * (window.innerWidth - 40);

  element.style.left = x + "px";
  element.style.top = "-40px";

  game.appendChild(element);

  coins.push({
    element: element,
    x: x,
    y: -40,
    speed: 3 + Math.random() * 3
  });

  setTimeout(createCoin, 700);
}

/* فحص التصادم */
function collision(a, b) {

  const ar = a.getBoundingClientRect();
  const br = b.getBoundingClientRect();

  return !(
    ar.right < br.left ||
    ar.left > br.right ||
    ar.bottom < br.top ||
    ar.top > br.bottom
  );
}

/* تحديث العملات */
function updateCoins() {

  if (!gameRunning) return;

  for (let i = coins.length - 1; i >= 0; i--) {

    const coin = coins[i];

    coin.y += coin.speed;

    coin.element.style.top = coin.y + "px";

    /* تم جمع العملة */
    if (collision(girl, coin.element)) {

      score++;

      scoreText.textContent = score;

      coin.element.remove();

      coins.splice(i, 1);

      continue;
    }

    /* العملة وصلت إلى الأرض */
    if (coin.y > window.innerHeight) {

      coin.element.remove();

      coins.splice(i, 1);

      lives--;

      livesText.textContent = lives;

      if (lives <= 0) {
        endGame();
      }
    }
  }
}

/* نهاية اللعبة */
function endGame() {

  gameRunning = false;

  document.getElementById("finalScore").textContent = score;

  document.getElementById("gameOver").style.display = "flex";

  saveHighScore();
}

/* حفظ أعلى نتيجة */
function saveHighScore() {

  const oldScore =
    Number(localStorage.getItem("highScore") || 0);

  if (score > oldScore) {

    localStorage.setItem(
      "highScore",
      score
    );
  }
}

/* حلقة اللعبة */
function gameLoop() {

  updateGirl();

  updateCoins();

  requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
      </html>
