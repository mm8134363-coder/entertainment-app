<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#073b2a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="description"
        content="نور المسلم - القرآن الكريم والأذكار ومواقيت الصلاة والقبلة والسبحة">

  <title>نور المسلم</title>

  <link rel="manifest" href="./manifest.json">

  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

  <style>

    /* =========================================================
       الأساس
       ========================================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f4f7f6;
      color: #17352d;
      font-family: "Cairo", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .screen {
      display: none;
      min-height: calc(100vh - 90px);
      animation: fadeIn .22s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================================
       شاشة البداية
       ========================================================= */

    .splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background:
        radial-gradient(circle at 50% 25%, rgba(196,155,62,.16), transparent 35%),
        linear-gradient(160deg, #063b2b, #05291f);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      transition: opacity .4s ease, visibility .4s ease;
    }

    .splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      width: min(90%, 420px);
      text-align: center;
    }

    .splash-logo {
      width: 135px;
      height: 135px;
      margin: 0 auto 22px;
      border-radius: 35px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      background: rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .splash h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 800;
    }

    .splash p {
      margin: 8px 0 0;
      opacity: .8;
      font-size: 15px;
    }

    .splash-loader {
      width: 45px;
      height: 45px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: #d4af58;
      border-radius: 50%;
      margin: 30px auto 0;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       الهيدر
       ========================================================= */

    .top-header {
      background:
        radial-gradient(circle at 90% 10%, rgba(212,175,88,.15), transparent 30%),
        linear-gradient(135deg, #073b2a, #075441);
      color: white;
      padding: 20px 18px 24px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 10px 35px rgba(4,52,39,.16);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .header-text {
      flex: 1;
    }

    .app-name {
      font-size: 25px;
      font-weight: 800;
      line-height: 1.4;
    }

    .app-subtitle {
      font-size: 12px;
      opacity: .78;
      margin-top: 2px;
    }

    .header-button {
      width: 45px;
      height: 45px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 14px;
      background: rgba(255,255,255,.08);
      color: white;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================================
       الحاوية
       ========================================================= */

    .container {
      width: min(100% - 28px, 720px);
      margin: 0 auto;
    }

    .page-space {
      padding-top: 18px;
    }

    /* =========================================================
       بطاقة الترحيب
       ========================================================= */

    .welcome-card {
      margin-top: -5px;
      background: linear-gradient(135deg, #fff, #f8fbfa);
      border: 1px solid rgba(7,59,42,.07);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 8px 25px rgba(25,70,55,.07);
    }

    .welcome-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .welcome-text {
      font-size: 13px;
      color: #71827c;
    }

    /* =========================================================
       بطاقة الصلاة القادمة
       ========================================================= */

    .next-prayer {
      margin-top: 14px;
      background: linear-gradient(135deg, #0b634d, #073b2a);
      color: white;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 12px 35px rgba(7,59,42,.18);
      position: relative;
      overflow: hidden;
    }

    .next-prayer::after {
      content: "☪";
      position: absolute;
      left: -5px;
      bottom: -22px;
      font-size: 110px;
      opacity: .05;
    }

    .next-label {
      font-size: 12px;
      opacity: .75;
    }

    .next-name {
      font-size: 26px;
      font-weight: 800;
      margin-top: 2px;
    }

    .next-time {
      font-size: 17px;
      margin-top: 3px;
      color: #f0d88b;
      font-weight: 700;
    }

    /* =========================================================
       العناوين
       ========================================================= */

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 23px 2px 12px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .section-heading button {
      border: 0;
      background: none;
      color: #0a765b;
      font-size: 12px;
    }

    /* =========================================================
       شبكة الخدمات
       ========================================================= */

    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
    }

    .service-card {
      background: white;
      border: 1px solid rgba(7,59,42,.06);
      border-radius: 20px;
      padding: 17px 13px;
      min-height: 125px;
      box-shadow: 0 7px 22px rgba(25,70,55,.055);
      text-align: center;
      color: #17352d;
      transition: transform .15s ease;
    }

    .service-card:active {
      transform: scale(.97);
    }

    .service-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 9px;
      border-radius: 16px;
      background: #edf6f2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #08745a;
      font-size: 25px;
    }

    .service-title {
      font-size: 14px;
      font-weight: 800;
    }

    .service-description {
      margin-top: 3px;
      color: #87948f;
      font-size: 10px;
    }

    /* =========================================================
       البطاقات العامة
       ========================================================= */

    .card {
      background: white;
      border-radius: 22px;
      padding: 18px;
      margin-top: 14px;
      box-shadow: 0 7px 24px rgba(25,70,55,.06);
      border: 1px solid rgba(7,59,42,.06);
    }

    .back-button {
      border: 0;
      background: #edf6f2;
      color: #075c46;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      font-size: 20px;
    }

    .screen-title {
      font-size: 23px;
      font-weight: 800;
      margin: 0;
    }

    .screen-subtitle {
      color: #7c8d87;
      font-size: 12px;
      margin-top: 3px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
    }

    /* =========================================================
       القرآن
       ========================================================= */

    .quran-search {
      display: flex;
      gap: 8px;
      margin-bottom: 13px;
    }

    .quran-search input,
    .normal-input {
      flex: 1;
      width: 100%;
      border: 1px solid #dce7e3;
      background: white;
      border-radius: 15px;
      padding: 13px 14px;
      outline: none;
      font-size: 13px;
      color: #17352d;
    }

    .quran-search input:focus,
    .normal-input:focus {
      border-color: #0b755a;
    }

    .quran-search button {
      width: 48px;
      border: 0;
      border-radius: 15px;
      background: #073b2a;
      color: white;
      font-size: 18px;
    }

    .surah-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .surah-item {
      background: white;
      border: 1px solid rgba(7,59,42,.06);
      border-radius: 18px;
      padding: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 5px 18px rgba(25,70,55,.045);
      cursor: pointer;
    }

    .surah-number {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: #edf6f2;
      color: #08745a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
    }

    .surah-info {
      flex: 1;
    }

    .surah-name {
      font-size: 15px;
      font-weight: 800;
    }

    .surah-meta {
      font-size: 10px;
      color: #899792;
      margin-top: 2px;
    }

    .surah-arrow {
      color: #a2b0ab;
      font-size: 18px;
    }

    /* =========================================================
       قراءة السورة
       ========================================================= */

    .quran-reader {
      padding-bottom: 30px;
    }

    .surah-header {
      text-align: center;
      background: linear-gradient(135deg, #073b2a, #0b624c);
      color: white;
      border-radius: 24px;
      padding: 25px 18px;
      margin-bottom: 15px;
      position: relative;
      overflow: hidden;
    }

    .surah-header::before {
      content: "۞";
      position: absolute;
      font-size: 130px;
      left: -10px;
      bottom: -45px;
      opacity: .05;
    }

    .surah-header h2 {
      margin: 0;
      font-size: 28px;
    }

    .surah-header p {
      margin: 4px 0 0;
      font-size: 12px;
      opacity: .78;
    }

    .basmala {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #826b2e;
      margin: 15px 0 20px;
    }

    .ayah {
      background: white;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 10px;
      border: 1px solid rgba(7,59,42,.06);
      box-shadow: 0 5px 18px rgba(25,70,55,.045);
    }

    .ayah-text {
      font-family: "Amiri", "Cairo", serif;
      font-size: 23px;
      line-height: 2.15;
      color: #19382e;
    }

    .ayah-number {
      display: inline-flex;
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: #edf6f2;
      color: #08745a;
      align-items: center;
      justify-content: center;
      font-family: "Cairo", sans-serif;
      font-size: 11px;
      font-weight: 800;
      margin-left: 7px;
      vertical-align: middle;
    }

    .ayah-actions {
      display: flex;
      justify-content: flex-start;
      gap: 7px;
      margin-top: 10px;
    }

    .ayah-action {
      border: 0;
      background: #f1f6f4;
      color: #537168;
      border-radius: 11px;
      padding: 7px 10px;
      font-size: 11px;
    }

    /* =========================================================
       الأذكار
       ========================================================= */

    .adhkar-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dhikr-card {
      background: white;
      border-radius: 21px;
      padding: 19px;
      box-shadow: 0 7px 22px rgba(25,70,55,.06);
      border: 1px solid rgba(7,59,42,.06);
    }

    .dhikr-title {
      font-weight: 800;
      color: #075c46;
      font-size: 14px;
      margin-bottom: 9px;
    }

    .dhikr-text {
      font-size: 17px;
      line-height: 2;
      color: #263f37;
    }

    .dhikr-count {
      margin-top: 13px;
      color: #a17f31;
      font-size: 12px;
      font-weight: 700;
    }

    /* =========================================================
       السبحة
       ========================================================= */

    .tasbeeh-box {
      text-align: center;
      padding: 25px 15px;
    }

    .tasbeeh-count {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      margin: 15px auto 25px;
      background:
        radial-gradient(circle at 35% 30%, #14755e, #063a2b);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(7,59,42,.23);
      border: 8px solid rgba(255,255,255,.09);
    }

    .tasbeeh-count-number {
      font-size: 55px;
      font-weight: 800;
    }

    .tasbeeh-label {
      font-size: 12px;
      opacity: .7;
    }

    .tasbeeh-button {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 0;
      background: #c39c47;
      color: white;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 14px 35px rgba(146,110,33,.23);
    }

    .tasbeeh-button:active {
      transform: scale(.95);
    }

    .reset-button {
      margin-top: 15px;
      border: 0;
      background: #edf6f2;
      color: #075c46;
      border-radius: 14px;
      padding: 11px 22px;
    }

    /* =========================================================
       مواقيت الصلاة
       ========================================================= */

    .location-card {
      background: linear-gradient(135deg, #073b2a, #0b634d);
      color: white;
      border-radius: 23px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .location-label {
      font-size: 11px;
      opacity: .7;
    }

    .location-name {
      font-size: 21px;
      font-weight: 800;
      margin-top: 3px;
    }

    .prayer-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .prayer-row {
      background: white;
      border-radius: 17px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 5px 17px rgba(25,70,55,.05);
      border: 1px solid rgba(7,59,42,.05);
    }

    .prayer-row.next {
      border: 1px solid #c6a34f;
      background: #fffdf6;
    }

    .prayer-name {
      font-weight: 800;
    }

    .prayer-icon {
      margin-left: 8px;
    }

    .prayer-time {
      color: #08745a;
      font-weight: 800;
      direction: ltr;
    }

    /* =========================================================
       القبلة
       ========================================================= */

    .qibla-card {
      text-align: center;
      padding: 25px 15px;
    }

    .compass {
      width: 270px;
      height: 270px;
      margin: 20px auto;
      border-radius: 50%;
      position: relative;
      background:
        radial-gradient(circle, #ffffff 0 56%, #edf5f2 57% 70%, #d5e6df 71% 100%);
      border: 10px solid #073b2a;
      box-shadow: 0 18px 45px rgba(7,59,42,.15);
    }

    .compass-n {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 800;
      color: #a57f29;
    }

    .compass-arrow {
      position: absolute;
      width: 6px;
      height: 100px;
      left: 50%;
      top: 48px;
      transform-origin: 50% 85%;
      transform: translateX(-50%) rotate(0deg);
      background: #b48a2e;
      border-radius: 10px;
    }

    .compass-arrow::before {
      content: "";
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-bottom: 25px solid #b48a2e;
    }

    .compass-center {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #073b2a;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qibla-degree {
      font-size: 27px;
      font-weight: 800;
      color: #075c46;
    }

    /* =========================================================
       التقويم
       ========================================================= */

    .calendar-card {
      text-align: center;
    }

    .gregorian-date {
      font-size: 15px;
      color: #7b8c86;
    }

    .hijri-date {
      font-size: 29px;
      font-weight: 800;
      color: #075c46;
      margin-top: 6px;
    }

    .events-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 16px;
    }

    .event-item {
      background: #f3f7f5;
      border-radius: 14px;
      padding: 12px;
      text-align: right;
    }

    .event-name {
      font-weight: 800;
      font-size: 13px;
    }

    .event-date {
      color: #7b8d86;
      font-size: 10px;
      margin-top: 2px;
    }

    /* =========================================================
       المفضلة
       ========================================================= */

    .empty-state {
      text-align: center;
      padding: 50px 15px;
      color: #83928c;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 10px;
      opacity: .5;
    }

    /* =========================================================
       الإعدادات
       ========================================================= */

    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .setting-row {
      background: white;
      border-radius: 17px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid rgba(7,59,42,.05);
    }

    .setting-info {
      flex: 1;
    }

    .setting-title {
      font-weight: 800;
      font-size: 14px;
    }

    .setting-description {
      color: #899791;
      font-size: 10px;
      margin-top: 2px;
    }

    .switch {
      width: 48px;
      height: 27px;
      border-radius: 20px;
      background: #dce6e2;
      border: 0;
      position: relative;
    }

    .switch::after {
      content: "";
      position: absolute;
      width: 21px;
      height: 21px;
      background: white;
      border-radius: 50%;
      top: 3px;
      right: 24px;
      transition: .2s;
      box-shadow: 0 2px 5px rgba(0,0,0,.12);
    }

    .switch.on {
      background: #08745a;
    }

    .switch.on::after {
      right: 3px;
    }

        /* =========================
       نتائج البحث
       ========================= */

    .search-results {
      margin-top: 12px;
      display: grid;
      gap: 10px;
    }

    .search-result {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      transition: .2s;
    }

    .search-result:active {
      transform: scale(.98);
    }

    .search-result-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 5px;
    }

    .search-result-subtitle {
      font-size: 13px;
      color: var(--muted);
    }

    .no-results {
      text-align: center;
      padding: 25px 15px;
      color: var(--muted);
      font-size: 14px;
    }


    /* =========================
       الرسائل المنبثقة
       ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 85px;
      transform: translateX(-50%) translateY(20px);
      background: #063f3b;
      color: white;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
      box-shadow: 0 8px 25px rgba(0,0,0,.2);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }


    /* =========================
       شريط التنقل السفلي
       ========================= */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 70px;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 5000;
      padding: 6px 5px env(safe-area-inset-bottom);
    }

    .nav-item {
      flex: 1;
      max-width: 85px;
      height: 58px;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border-radius: 14px;
      cursor: pointer;
      font-family: inherit;

      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });

      const target = document.getElementById(screenId);

      if (target) {
        target.classList.add("active");
      }

      document.querySelectorAll(".nav-item").forEach(item => {
        item.classList.remove("active");
      });

      const navButton = document.querySelector(
        `.nav-item[data-screen="${screenId}"]`
      );

      if (navButton) {
        navButton.classList.add("active");
      }

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    let toastTimer;

    function showToast(message) {

      const toast = document.getElementById("toast");

      if (!toast) return;

      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);

    /* =========================

       ========================= */

    async function loadQuran() {

      const container = document.getElementById("surahList");

      if (!container) return;

      container.innerHTML = `
        <div class="no-results">
          جاري تحميل القرآن الكريم...
        </div>
      `;

      try {

        const response = await fetch("./quran.json", {
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error("Quran file not found");
        }

        quranData = await response.json();

        renderSurahs(quranData);

      } catch (error) {

        console.error(error);

        container.innerHTML = `
          <div class="no-results">
            تعذر تحميل القرآن الكريم.
            <br>
            تأكد من وجود ملف
            <strong>quran.json</strong>
          </div>
        `;
      }
    }


    function renderSurahs(data) {

      const container = document.getElementById("surahList");

      if (!container) return;

      if (!data || !data.length) {

        container.innerHTML = `
          <div class="no-results">
            لا توجد سور لعرضها.
          </div>
        `;

        return;
      }

      container.innerHTML = data.map((surah, index) => {

        const number =
          surah.number ||
          surah.id ||
          index + 1;

        const name =
          surah.name ||
          `سورة ${number}`;

        const ayahCount =
          surah.numberOfAyahs ||
          surah.ayahs?.length ||
          0;

        return `
          <button
            class="surah-card"
            type="button"
            onclick="openSurah(${number})"
          >

            <div class="surah-number">
              ${number}
            </div>

            <div class="surah-info">

              <div class="surah-name">
                ${escapeHtml(name)}
              </div>

              <div class="surah-meta">
                ${ayahCount} آية
              </div>

            </div>

            <div class="surah-arrow">

            </div>

          </button>
        `;

      }).join("");
    }


    function filterSurahs() {

      const input =
        document.getElementById("quranSearch");

      if (!input) return;

      const value =
        input.value.trim().toLowerCase();

      if (!value) {

        renderSurahs(quranData);

        return;
      }

      const filtered =
        quranData.filter(surah => {

          const number =
            String(
              surah.number ||
              surah.id ||
              ""
            );

          const name =
            String(
              surah.name ||
              ""
            ).toLowerCase();

          return (
            name.includes(value) ||
            number === value
          );

        });

      renderSurahs(filtered);
    }


    function openSurah(number) {

      const surah =
        quranData.find(item =>
          Number(item.number || item.id) === Number(number)
        );

      if (!surah) {

        showToast("السورة غير موجودة");

        return;
      }

      currentSurah = surah;

      const title =
        document.getElementById("surahTitle");

      const container =
        document.getElementById("ayahList");

      if (title) {

        title.textContent =
          surah.name ||
          `سورة ${number}`;

      }

      if (!container) return;

      const ayahs =
        surah.ayahs ||
        surah.verses ||
        [];

      container.innerHTML =
        ayahs.map((ayah, index) => {

          const ayahText =
            typeof ayah === "string"
              ? ayah
              : (
                  ayah.text ||
                  ayah.aya_text ||

          const ayahNumber =
            ayah.numberInSurah ||
            ayah.number ||
            index + 1;

    /* =========================
       المفضلة
       ========================= */

    function favoriteKey(surah, ayah) {
      return `${surah}:${ayah}`;
    }


    function isFavorite(surah, ayah) {

      return favorites.some(item =>
        item.key === favoriteKey(surah, ayah)
      );
    }


    function toggleFavorite(
      surah,
      ayah,
      text
    ) {

      const key =
        favoriteKey(surah, ayah);

      const existing =
        favorites.findIndex(item =>
          item.key === key
        );

      if (existing >= 0) {

        favorites.splice(existing, 1);

        showToast("تمت الإزالة من المفضلة");

      } else {

        favorites.push({
          key,
          surah,
          ayah,
          text
        });

        showToast("تم الحفظ في المفضلة");
      }

      localStorage.setItem(
        "noorFavorites",
        JSON.stringify(favorites)
      );

      if (currentSurah) {
        openSurah(
          currentSurah.number ||
          currentSurah.id
        );
      }

      renderFavorites();
    }

      const container =

    function removeFavorite(key) {

    /* =========================
       مواقيت الصلاة
       ========================= */

    function calculatePrayerTimes() {

      /*
       * الموقع الافتراضي:
       * مصر - قنا
       *
       * ويمكن استبداله بموقع الجهاز
       * عند السماح بالموقع.
       */

      const latitude = 26.1551;
      const longitude = 32.7160;

      const date =
        getEgyptDate();

      const times =
        prayerCalculator(
          date,
          latitude,
          longitude
        );

      const names = {
        fajr: "الفجر",
        sunrise: "الشروق",
        dhuhr: "الظهر",
        asr: "العصر",
        maghrib: "المغرب",
        isha: "العشاء"
      };

      Object.keys(names).forEach(key => {

        const element =
          document.getElementById(
            `prayer-${key}`
          );

        if (element) {
          element.textContent =
            times[key];
        }

      });

      const location =
        document.getElementById(
          "prayerLocation"
        );

      if (location) {
        location.textContent =
          "قنا - مصر";
      }

    }


    /*
     * حساب تقريبي داخلي لمواقيت الصلاة.
     * لا يحتاج إلى إنترنت.
     */

    function prayerCalculator(
      date,
      latitude,
      longitude
    ) {

      const dayOfYear =
        Math.floor(
          (
            Date.UTC(
              date.getFullYear(),
              date.getMonth(),
              date.getDate()
            ) -
            Date.UTC(
              date.getFullYear(),
              0,
              0
            )
          ) /
          86400000
        );

      const declination =
        23.44 *
        Math.sin(
          (
            360 *
            (284 + dayOfYear) /
            365
          ) *
          Math.PI / 180
        );

      const equation =
        9.87 *
        Math.sin(
          2 *
          (
            2 *
            Math.PI *
            (dayOfYear - 81) /
            364
          )
        ) -
        7.53 *
        Math.cos(
          2 *
          Math.PI *
          (dayOfYear - 81) /
          364
        ) -
        1.5 *
        Math.sin(
          2 *
          Math.PI *
          (dayOfYear - 81) /
          364
        );

      const solarNoon =
        12 -
        longitude / 15 -
        equation / 60;

      function hourAngle(angle) {

        const cosH =
          (
              function hourAngle(angle) {

        const cosH =
          (
            Math.cos(
              angle * Math.PI / 180
            ) -
            Math.sin(
              latitude * Math.PI / 180
            ) *
            Math.sin(
              declination * Math.PI / 180
            )
          ) /
          (
            Math.cos(
              latitude * Math.PI / 180
            ) *
            Math.cos(
              declination * Math.PI / 180
            )
          );

        if (cosH > 1) {
          return NaN;
        }

        if (cosH < -1) {
          return NaN;
        }

        return Math.acos(cosH) *
          180 /
          Math.PI /
          15;
      }


      /* =========================
         وقت الفجر
         ========================= */

      const fajr =
        solarNoon -
        hourAngle(108);


      /* =========================
         وقت الشروق
         ========================= */

      const sunrise =
        solarNoon -
        hourAngle(90.833);


      /* =========================
         وقت الظهر
         ========================= */

      const dhuhr =
        solarNoon +
        0.05;


      /* =========================
         وقت العصر
         ========================= */

      const asrAngle =
        Math.atan(
          1 /
          (
            Math.tan(
              Math.abs(
                latitude -
                declination
              ) *
              Math.PI /
              180
            )
          )
        ) *
        180 /
        Math.PI;

      const asr =
        solarNoon +
        hourAngle(asrAngle);


      /* =========================
         وقت المغرب
         ========================= */

      const maghrib =
        solarNoon +
        hourAngle(90.833);


      /* =========================
         وقت العشاء
         ========================= */

      const isha =
        solarNoon +
        hourAngle(107);


      /* =========================
         تحويل الوقت إلى صيغة 24 ساعة
         ========================= */

      function formatTime(hours) {

        if (!Number.isFinite(hours)) {
          return "--:--";
        }

        hours =
          (
            hours +
            24
          ) % 24;

        let hour =
          Math.floor(hours);

        let minute =
          Math.round(
            (hours - hour) * 60
          );

        if (minute >= 60) {

          minute = 0;

          hour =
            (hour + 1) % 24;
        }

        return (
          String(hour).padStart(2, "0") +
          ":" +
          String(minute).padStart(2, "0")
        );
      }


      /* =========================
         النتيجة النهائية لمواقيت الصلاة
         ========================= */

      return {

        fajr:
          formatTime(fajr),

        sunrise:
          formatTime(sunrise),

        dhuhr:
          formatTime(dhuhr),

        asr:
          formatTime(asr),

        maghrib:
          formatTime(maghrib),

        isha:
          formatTime(isha)

      };

    }

    /* =========================================================
       القبلة
       ========================================================= */

    const KAABA_LATITUDE =
      21.422487;

    const KAABA_LONGITUDE =
      39.826206;


    function calculateQiblaDirection(
      latitude,
      longitude
    ) {

      const lat1 =
        latitude *
        Math.PI /
        180;

      const lat2 =
        KAABA_LATITUDE *
        Math.PI /
        180;

      const deltaLongitude =
        (
          KAABA_LONGITUDE -
          longitude
        ) *
        Math.PI /
        180;

      const y =
        Math.sin(
          deltaLongitude
        );

      const x =
        Math.cos(lat1) *
        Math.tan(lat2) -
        Math.sin(lat1) *
        Math.cos(deltaLongitude);

      let bearing =
        Math.atan2(
          y,
          x
        ) *
        180 /
        Math.PI;

      bearing =
        (
          bearing +
          360
        ) % 360;

      return bearing;
    }


    function getQiblaDirection() {

      if (!navigator.geolocation) {

        showToast(
          "الموقع الجغرافي غير متاح"
        );

        return;
      }

      showToast(
        "جاري تحديد اتجاه القبلة..."
      );

      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          const direction =
            calculateQiblaDirection(
              latitude,
              longitude
            );

          const degree =
            document.getElementById(
              "qiblaDegree"
            );

          if (degree) {

            degree.textContent =
              Math.round(direction) +
              "°";

          }

          const arrow =
            document.getElementById(
              "qiblaArrow"
            );

          if (arrow) {

            arrow.style.transform =
              "rotate(" +
              direction +
              "deg)";
          }

          showToast(
            "تم تحديد اتجاه القبلة"
          );

        },

        function() {

          showToast(
            "اسمح للتطبيق باستخدام الموقع"
          );

        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 300000
        }

      );
    }


    /* =========================================================
       السبحة الإلكترونية
       ========================================================= */

    function loadTasbeeh() {

      const saved =
        localStorage.getItem(
          "tasbeehCount"
        );

      if (
        saved !== null &&
        !Number.isNaN(
          Number(saved)
        )
      ) {

        tasbeehCount =
          Number(saved);

      }

      updateTasbeeh();
    }


    function updateTasbeeh() {

      const counter =
        document.getElementById(
          "tasbeehCount"
        );

      if (counter) {

        counter.textContent =
          tasbeehCount;
      }

      localStorage.setItem(
        "tasbeehCount",
        String(tasbeehCount)
      );
    }


    function incrementTasbeeh() {

      tasbeehCount++;

      updateTasbeeh();

      if (
        navigator.vibrate &&
        tasbeehCount % 10 === 0
      ) {

        navigator.vibrate(35);
      }
    }


    function resetTasbeeh() {

      tasbeehCount = 0;

      updateTasbeeh();

      showToast(
        "تم تصفير السبحة"
      );
    }


    /* =========================================================
       الوضع الليلي
       ========================================================= */

    function loadDarkMode() {

      const saved =
        localStorage.getItem(
          "noorDarkMode"
        );

      if (saved === "1") {

        document.body.classList.add(
          "dark"
        );

      } else {

        document.body.classList.remove(
          "dark"
        );
      }

      updateDarkSwitch();
    }


    function toggleDarkMode() {

      document.body.classList.toggle(
        "dark"
      );

      const enabled =
        document.body.classList.contains(
          "dark"
        );

      localStorage.setItem(
        "noorDarkMode",
        enabled ? "1" : "0"
      );

      updateDarkSwitch();
    }


    function updateDarkSwitch() {

      const button =
        document.getElementById(
          "darkModeSwitch"
        );

      if (!button) return;

      const enabled =
        document.body.classList.contains(
          "dark"
        );

      button.classList.toggle(
        "on",
        enabled
      );

      button.setAttribute(
        "aria-checked",
        enabled
          ? "true"
          : "false"
      );
    }


    /* =========================================================
       الإشعارات
       ========================================================= */

    async function enableNotifications() {

      if (
        !("Notification" in window)
      ) {

        showToast(
          "التنبيهات غير مدعومة"
        );

        return;
      }

      try {

        const permission =
          await Notification.requestPermission();

        if (
          permission ===
          "granted"
        ) {

          showToast(
            "تم تفعيل التنبيهات"
          );

          if (
            "serviceWorker" in
            navigator
          ) {

            const registration =
              await navigator.serviceWorker.ready;

            if (
              registration.showNotification
            ) {

              registration.showNotification(
                "نور المسلم",
                {
                  body:
                    "تم تفعيل التنبيهات بنجاح",
                  icon:
                    "./icon-192-1.png",
                  badge:
                    "./icon-192-1.png"
                }
              );

            }

          }

        } else {

          showToast(
            "لم يتم السماح بالتنبيهات"
          );
        }

      } catch (error) {

        console.error(error);

        showToast(
          "تعذر تفعيل التنبيهات"
        );
      }
    }


    /* =========================================================
       مسح بيانات التطبيق
       ========================================================= */

    function clearAppData() {

      const confirmed =
        confirm(
          "هل تريد مسح المفضلة والسبحة وإعدادات التطبيق؟"
        );

      if (!confirmed) return;

      localStorage.removeItem(
        "noorFavorites"
      );

      localStorage.removeItem(
        "tasbeehCount"
      );

      localStorage.removeItem(
        "noorDarkMode"
      );

      favorites = [];

      tasbeehCount = 0;

      document.body.classList.remove(
        "dark"
      );

      updateTasbeeh();

      updateDarkSwitch();

      renderFavorites();

      showToast(
        "تم مسح بيانات التطبيق"
      );
    }


    /* =========================================================
       البحث العام
       ========================================================= */

    function globalSearch() {

      const input =
        document.getElementById(
          "globalSearch"
        );

      const results =
        document.getElementById(
          "globalSearchResults"
        );

      if (!input || !results) {
        return;
      }

      const query =
        input.value
          .trim()
          .toLowerCase();

      if (!query) {

        results.innerHTML =
          "";

        return;
      }

      const matches = [];


      /* البحث في السور */

      quranData.forEach(
        function(surah) {

          const name =
            String(
              surah.name || ""
            ).toLowerCase();

          if (
            name.includes(query)
          ) {

            matches.push({
              title:
                surah.name,

              subtitle:
                "القرآن الكريم",

              action:
                function() {

                  openSurah(
                    surah.number ||
                    surah.id
                  );

                }

            });

          }

        }
      );


      /* البحث في الأذكار */

      adhkarData.forEach(
        function(dhikr) {

          const title =
            String(
              dhikr.title || ""
            ).toLowerCase();

          const text =
            String(
              dhikr.text || ""
            ).toLowerCase();

          if (
            title.includes(query) ||
            text.includes(query)
          ) {

            matches.push({
              title:
                dhikr.title,

              subtitle:
                "الأذكار والأدعية",

              action:
                function() {

                  openScreen(
                    "adhkarScreen"
                  );

                }

            });

          }

        }
      );


      if (!matches.length) {

        results.innerHTML = `
          <div class="no-results">
            لا توجد نتائج للبحث
          </div>
        `;

        return;
      }


      window.currentSearchResults =
        matches;


      results.innerHTML =
        matches.map(
          function(item, index) {

            return `
              <button
                type="button"
                class="search-result"
                onclick="runSearchResult(${index})"
              >

                <div class="search-result-title">
                  ${escapeHtml(
                    item.title
                  )}
                </div>

                <div class="search-result-subtitle">
                  ${escapeHtml(
                    item.subtitle
                  )}
                </div>

              </button>
            `;

          }
        ).join("");
    }


    function runSearchResult(index) {

      const results =
        window.currentSearchResults ||
        [];

      if (
        results[index] &&
        typeof results[index].action ===
          "function"
      ) {

        results[index].action();
      }
    }


    /* =========================================================
       تهيئة التطبيق
       ========================================================= */

    function initializeApp() {

      loadTasbeeh();

      loadDarkMode();

      renderFavorites();

      renderAdhkar();

      updateGregorianDate();

      updateHijriDate();

      calculatePrayerTimes();

      loadQuran();

      setTimeout(
        function() {

          const splash =
            document.getElementById(
              "splashScreen"
            );

          if (splash) {

            splash.classList.add(
              "hide"
            );

            setTimeout(
              function() {

                splash.remove();

              },
              500
            );

          }

        },
        1200
      );
    }


    /* =========================================================
       تحديث تلقائي للتاريخ والمواقيت
       ========================================================= */

    setInterval(
      function() {

        updateGregorianDate();

        updateHijriDate();

        refreshPrayerTimes();

      },
      60000
    );


    /* =========================================================
       تسجيل Service Worker
       ========================================================= */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker
            .register(
              "./service-worker.js"
            )
            .then(
              function() {

                console.log(
                  "نور المسلم يعمل بنظام PWA"
                );

              }
            )
            .catch(
              function(error) {

                console.error(
                  "Service Worker:",
                  error
                );

              }
            );

        }
      );
    }


    /* =========================================================
       تشغيل التطبيق
       ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        initializeApp();

      }
    );

  </script>

</body>
