<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>تطبيق ترفيهي</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#24104f,#5720a8,#1469ee);
  color:#222;
}

button{
  border:0;
  cursor:pointer;
  font-size:16px;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:#f7f7fb;
  position:relative;
  overflow:hidden;
}

/* LOGIN */
.login-page{
  min-height:100vh;
  padding:35px 22px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-box{
  width:100%;
  background:white;
  border-radius:30px;
  padding:35px 22px;
  box-shadow:0 10px 35px rgba(0,0,0,.2);
  text-align:center;
}

.logo{
  width:145px;
  height:145px;
  margin:auto;
  border-radius:50%;
  background:linear-gradient(135deg,#7114df,#176df1);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:75px;
  box-shadow:0 8px 25px rgba(70,30,200,.3);
}

.login-box h1{
  margin-top:22px;
  font-size:34px;
}

.subtitle{
  color:#999;
  margin:12px 0 28px;
  font-size:17px;
}

.input{
  width:100%;
  height:58px;
  border:1px solid #ddd;
  border-radius:18px;
  padding:0 18px;
  margin-bottom:14px;
  font-size:17px;
  outline:none;
  text-align:right;
}

.input:focus{
  border-color:#4d55ed;
}

.main-btn{
  width:100%;
  height:60px;
  border-radius:18px;
  color:white;
  background:linear-gradient(90deg,#7214d9,#2877ef);
  font-size:20px;
  font-weight:bold;
  margin:5px 0 25px;
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  color:#aaa;
  margin:20px 0;
}

.divider span{
  height:1px;
  background:#ddd;
  flex:1;
}

.social{
  width:100%;
  height:58px;
  border:1px solid #ddd;
  border-radius:17px;
  background:white;
  margin-bottom:12px;
  font-size:17px;
}

.facebook{
  color:#1877f2;
}

.google{
  color:#db4437;
}

.phone{
  color:#4384ca;
}

.footer-text{
  color:#aaa;
  margin-top:25px;
}

/* HOME */
.home{
  display:none;
  min-height:100vh;
  padding-bottom:75px;
}

.top{
  background:linear-gradient(135deg,#24104f,#6122b8,#276ff0);
  color:white;
  padding:22px 18px;
  border-radius:0 0 28px 28px;
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.user-info{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  background:white;
  color:#6122b8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
}

.user-name{
  font-size:20px;
  font-weight:bold;
}

.user-level{
  font-size:13px;
  opacity:.8;
  margin-top:5px;
}

.coin-box{
  background:rgba(255,255,255,.18);
  border-radius:20px;
  padding:10px 13px;
  text-align:center;
}

.coin-box
