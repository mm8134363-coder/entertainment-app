<!DOCTYPE html>
<html lang="ar" dir="rtl">

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

    body {
      background: #f5f5f5;
      min-height: 100vh;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 22px;
      border-radius: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    .logo {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: linear-gradient(135deg,#7b2cff,#ff3cac);

      align-items: center;
      justify-content: center;
      color: white;
      font-size: 35px;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 8px;
      color: #222;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #7b2cff;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg,#7b2cff,#ff3cac);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .or {
      color: #999;
      margin: 10px 0 18px;
    }

    .social-btn {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
    }

    .facebook {
      color: #1877f2;
    }

    .gmail {
      color: #db4437;
    }

    .phone {
      color: #333;
    }

    .home-page {
      display: none;
      min-height: 100vh;
      padding-bottom: 80px;
    }

      color: white;
      padding: 22px;
      border-radius: 0 0 25px 25px;
    }

    .top-bar h2 {
      margin-bottom: 8px;
    }

      padding: 20px;
