<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>تطبيق ترفيهي</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#24104f,#5720a8,#1469ee);
  color:#222;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:#f7f7fb;
}

/* تسجيل الدخول */
#loginPage{
  min-height:100vh;
  padding:35px 22px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-box{
  width:100%;
  background:white;
  border-radius:30px;
  padding:35px 25px;
  text-align:center;
  box-shadow:0 10px 40px #0003;
}

.logo{
  width:110px;
  height:110px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  color:white;
  background:linear-gradient(135deg,#6b13df,#176df0);
}

.login-box h1{
  margin-top:25px;
  font-size:34px;
}

.subtitle{
  margin:12px 0 25px;
  color:#888;
  font-size:17px;
}

.input{
  width:100%;
  padding:17px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:16px;
  font-size:17px;
  outline:none;
  text-align:right;
}

.main-btn{
  width:100%;
  padding:17px;
  margin-top:12px;
  border-radius:16px;
  color:white;
  font-size:19px;
  font-weight:bold;
  background:linear-gradient(90deg,#6710dc,#2475f4);
}

.or{
  margin:25px 0;
  color:#999;
}

.social{
  width:100%;
  padding:15px;
  margin:7px 0;
  border-radius:15px;
  background:white;
  border:1px solid #ddd;
  font-size:17px;
}

.social.facebook{color:#1877f2}
.social.gmail{color:#db4437}

.note{
  margin-top:25px;
  color:#999;
}

/* التطبيق */
#appPage{
  display:none;
  min-height:100vh;
  padding-bottom:80px;
}

.header{
  padding:20px;
  color:white;
  background:linear-gradient(135deg,#4c13a8,#2269ed);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h2{
  font-size:23px;
}

.coins{
  background:#ffffff22;
  padding:9px 13px;
  border-radius:20px;
}

.page{
  display:none;
  padding:18px;
}

.page.active{
  display:block;
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 3px 15px #0000000d;
}

.welcome{
  background:linear-gradient(135deg,#6514d7,#2674f4);
  color:white;
}

.welcome h2{
  margin-bottom:10px;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.menu-btn{
  background:white;
  border-radius:18px;
  padding:20px 8px;
  font-size:15px;
  box-shadow:0 3px 12px #0001;
}

.menu-btn div{
  font-size:30px;
  margin-bottom:8px;
}

/* الرومات */
.room{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid #eee;
}
