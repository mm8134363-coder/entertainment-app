<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق ترفيهي</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f5fa;
  color:#20243a;
  min-height:100vh;
}

button{
  border:0;
  cursor:pointer;
}

.page{
  display:none;
  min-height:100vh;
}

.page.active{
  display:block;
}

/* تسجيل الدخول */
.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#5b45d9,#9b63e8);
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:25px;
  padding:30px 22px;
  text-align:center;
  box-shadow:0 15px 40px #0003;
}

.logo{
  width:85px;
  height:85px;
  margin:auto;
  border-radius:25px;
  background:linear-gradient(135deg,#6a4ce8,#c45cff);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:38px;
  font-weight:bold;
}

.login h1{
  margin-top:18px;
  font-size:28px;
}

.login p{
  margin:10px 0 25px;
  color:#777;
}

.login-btn{
  width:100%;
  padding:15px;
  border-radius:14px;
  margin-top:12px;
  font-size:16px;
  font-weight:bold;
}

.facebook{
  background:#1877f2;
  color:white;
}

.google{
  background:#fff;
  border:1px solid #ddd;
}

.phone{
  background:#6b4ce6;
  color:white;
}

  padding:20px 18px 25px;
  border-radius:0 0 25px 25px;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
