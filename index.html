<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق ترفيهي</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#24104f,#5720a8,#1469ee);
  color:#222;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:#f7f7fb;
  position:relative;
  overflow:hidden;
}

/* LOGIN */
#loginPage{
  min-height:100vh;
  padding:25px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.loginBox{
  width:100%;
  background:white;
  border-radius:32px;
  padding:35px 20px;
  text-align:center;
  box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.logo{
  width:115px;
  height:115px;
  margin:auto;
  border-radius:50%;
  background:linear-gradient(135deg,#6b10d8,#2879f4);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  color:white;
}

.loginBox h1{
  margin-top:25px;
  font-size:32px;
}

.subtitle{
  color:#888;
  margin:12px 0 25px;
  font-size:16px;
}

.input{
  width:100%;
  height:58px;
  border:1px solid #ddd;
  border-radius:18px;
  padding:0 18px;
  font-size:17px;
  margin-bottom:14px;
  outline:none;
}

.input:focus{
  border-color:#5720a8;
}

.mainBtn{
  width:100%;
  height:58px;
  border-radius:18px;
  color:white;
  font-size:19px;
  font-weight:bold;
  background:linear-gradient(90deg,#6b10d8,#2879f4);
  margin:5px 0 25px;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  color:#999;
  margin-bottom:18px;
}

.divider span{
  flex:1;
  height:1px;
  background:#ddd;
}

.socialBtn{
  width:100%;
  height:55px;
  background:white;
  border:1px solid #ddd;
  border-radius:17px;
  margin-bottom:12px;
  font-size:16px;
}

.facebook{
  color:#1877f2;
}

.gmail{
  color:#d64545;
}

.footerText{
  color:#aaa;
  margin-top:28px;
}

/* APP */
#appPage{
  display:none;
  min-height:100vh;
  padding-bottom:75px;
}

.top{
  padding:18px;
  background:linear-gradient(90deg,#5e18c9,#2774ef);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.top h2{
  font-size:21px;
}

.coins{
  background:rgba(255,255,255,.2);
  padding:8px 12px;
  border-radius:20px;
}

.page{
  display:none;
  padding:18px;
}

.page.active{
  display:block;
}

/* HOME */
.welcome{
  background:linear-gradient(135deg,#5720a8,#2879f4);
  color:white;
  padding:22px;
  border-radius:24px;
  margin-bottom:18px;
}

.welcome h2{
  margin-bottom:8px;
}

.sectionTitle{
  margin:20px 0 12px;
  font-size:20px;
}
