<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تجربة</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: grid;
  place-items: center;
  font-family: Arial;
  background: #111;
  color: white;
}
button {
  padding: 18px 35px;
  font-size: 20px;
  border: 0;
  border-radius: 12px;
  cursor: pointer;
}
#msg {
  margin-top: 20px;
  text-align: center;
}
</style>
</head>
<body>

<div>
  <button onclick="demo()">اضغط هنا</button>
  <div id="msg"></div>
</div>

<script>
function demo() {
  document.body.style.background = "#222";
  document.getElementById("msg").textContent =
    "😄 مجرد تجربة — لم يتم تغيير أي شيء في الهاتف!";
}
</script>

</body>
</html>
