<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق ترفيهي</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f4f6;
  min-height:100vh;
}

/* ================= تسجيل الدخول ================= */

.login-page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#171126,#35135c);
}

.login-box{
  width:100%;
  max-width:400px;
  background:#fff;
  padding:30px 22px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.logo{
  width:85px;
  height:85px;
  margin:0 auto 20px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7b2cff,#ff3cac);
  color:#fff;
  font-size:34px;
  font-weight:bold;
}

.login-box h1{
  margin-bottom:8px;
}

.subtitle{
  color:#777;
  margin-bottom:25px;
}

.login-box input{
  width:100%;
  padding:15px;
  margin-bottom:14px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:16px;
}

.login-btn,
.social-btn{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
}

.login-btn{
  border:0;
  background:linear-gradient(135deg,#7b2cff,#ff3cac);
  color:#fff;
  font-weight:bold;
}

.social-btn{
  background:#fff;
  border:1px solid #ddd;
}

.facebook{color:#1877f2;}
.gmail{color:#db4437;}
.phone{color:#333;}

.or{
  color:#999;
  margin:12px 0;
}

/* ================= التطبيق ================= */

.app{
  display:none;
  min-height:100vh;
  padding-bottom:75px;
}

.top-bar{
  padding:22px 18px;
  color:#fff;
  background:linear-gradient(135deg,#7b2cff,#ff3cac);
  border-radius:0 0 25px 25px;
}

.top-bar h2{
  margin-bottom:6px;
}

.content{
  padding:18px;
}

/* الصفحة الرئيسية */

.home-card{
  background:#fff;
  padding:20px;
  border-radius:20px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.home-card h3{
  margin-bottom:8px;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.quick-item{
  background:#fff;
  padding:20px 10px;
  text-align:center;
  border-radius:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  cursor:pointer;
}

.quick-item span{
  display:block;
  font-size:28px;
  margin-bottom:8px;
}

/* ================= الرومات ================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

.page-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.page-title h2{
  font-size:22px;
}

.create-room{
  border:0;
  padding:10px 14px;
  border-radius:12px;
  background:#7b2cff;
  color:#fff;
}

.room-list{
  background:#fff;
  border-radius:20px;
  padding:5px 15px;
}

.room{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.room:last-child{
  border-bottom:0;
}

.room-icon{
  width:55px;
  height:55px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  font-size:27px;
}

.room-info{
  flex:1;
}

.room-info h3{
  margin-bottom:5px;
}

.room-info p{
  color:#888;
  font-size:13px;
}

.join-room{
  border:0;
  padding:9px 15px;
  border-radius:12px;
  background:#7b2cff;
  color:#fff;
}

/* ================= الحساب ================= */

.account-page{
  padding:20px 16px;
}

.account-header{
  text-align:center;
  padding:10px 0 20px;
}

/* الصورة للعرض فقط */
.account-avatar{
  width:95px;
  height:95px;
  margin:auto;
  border-radius:50%;
  overflow:hidden;
  border:3px solid #8b3dff;
  box-shadow:0 0 18px rgba(123,44,255,.35);
}

.account-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
}

/* الاسم للعرض فقط */
.account-name{
  margin-top:12px;
  font-size:20px;
  font-weight:bold;
}

/* ID */
.account-id{
  margin-top:7px;
  color:#777;
  font-size:13px;
}

/* الثروة والكاريزما و VIP */

.account-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:18px;
}

.stat-box{
  background:#fff;
  border-radius:17px;
  padding:14px 5px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}
