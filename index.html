<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تطبيق ترفيهي</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{
  background:linear-gradient(135deg,#24104f,#5720a8,#1469ee);
  min-height:100vh;color:#222;
}
button{border:0;cursor:pointer}
.app{
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:#f7f7fb;
  position:relative;
  overflow:hidden;
}
.page{display:none;min-height:100vh;padding-bottom:80px}
.page.active{display:block}

/* LOGIN */
.login{
  min-height:100vh;
  padding:35px 22px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.login-box{
  width:100%;
  background:white;
  border-radius:30px;
  padding:35px 25px;
  text-align:center;
  box-shadow:0 10px 35px #0004;
}
.logo{
  width:110px;height:110px;
  margin:auto;
  border-radius:50%;
  background:linear-gradient(135deg,#6a11cb,#2575fc);
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:58px;
}
.login h1{margin-top:22px;font-size:32px}
.subtitle{color:#888;margin:12px 0 28px}
.input{
  width:100%;
  padding:18px;
  border:1px solid #ddd;
  border-radius:18px;
  margin-bottom:14px;
  font-size:17px;
  text-align:right;
}
.main-btn{
  width:100%;
  padding:18px;
  border-radius:18px;
  background:linear-gradient(90deg,#6515d5,#2475f5);
  color:white;
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}
.social{
  width:100%;
  padding:16px;
  border:1px solid #ddd;
  background:white;
  border-radius:17px;
  margin-top:10px;
  font-size:17px;
}
.divider{
  margin:20px 0;color:#aaa;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#4d13a8,#2575fc);
  color:white;
  padding:22px 18px;
  border-radius:0 0 25px 25px;
}
.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header h2{font-size:25px}
.coins{
  background:#ffffff25;
  padding:10px 14px;
  border-radius:15px;
}

/* HOME */
.banner{
  margin:18px;
  padding:25px;
  border-radius:22px;
  background:linear-gradient(135deg,#fff,#eeeaff);
}
.banner h2{margin-bottom:8px}
.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:0 18px;
}
.card{
  background:white;
  border-radius:20px;
  padding:22px 12px;
  text-align:center;
  box-shadow:0 3px 12px #0001;
}
.icon{font-size:35px;margin-bottom:8px}
.section-title{
  padding:22px 18px 12px;
  font-size:21px;
  font-weight:bold;
}

/* ROOMS */
.room{
  background:white;
  margin:10px 18px;
  padding:15px;
  border-radius:18px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 3px 10px #0001;
}
.room-img{
  width:60px;height:60px;
  border-radius:15px;
  background:linear-gradient(135deg,#7b2cff,#277cff);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;color:white;
}
.room-info{flex:1}
