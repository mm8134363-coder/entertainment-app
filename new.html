<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامج ترفيه وتسلية</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f6fa;
  color:#222;
  padding-bottom:75px;
}

button{
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.top{
  height:65px;
  background:linear-gradient(135deg,#32106b,#1769aa);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.coins{
  background:rgba(255,255,255,.15);
  padding:10px 14px;
  border-radius:20px;
}

.page{
  display:none;
  padding:18px;
}

.page.active{
  display:block;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#32106b,#1769aa);
}

.login-box{
  background:white;
  width:100%;
  max-width:400px;
  padding:28px;
  border-radius:25px;
  text-align:center;
}

.login-box h1{
  margin-bottom:10px;
}

.login-box p{
  color:#777;
  margin-bottom:20px;
}

.input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:12px;
  font-size:16px;
}

.main-btn{
  width:100%;
  padding:14px;
  background:#32106b;
  color:white;
  border-radius:12px;
  font-size:16px;
}

.profile-head{
  text-align:center;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#eee;
  margin:auto;
  display:flex;
align-items:center;
  justify-content:center;
