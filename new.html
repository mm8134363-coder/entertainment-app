<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامج ترفيه وتسلية</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f6fa;
  color:#222;
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:white;
  padding-bottom:75px;
}

header{
  padding:18px;
  background:linear-gradient(135deg,#7b2cff,#b82cff);
  color:white;
  text-align:center;
}

header h1{
  font-size:24px;
}

header p{
  margin-top:6px;
  opacity:.9;
}

.page{
  display:none;
  padding:18px;
}

.page.active{
  display:block;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.login{
  padding:35px 20px;
  text-align:center;
}

.logo{
  width:90px;
  height:90px;
  margin:20px auto;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7b2cff,#ff3cac);
  color:white;
  font-size:42px;
}

input,select{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

button{
  border:0;
  cursor:pointer;
}

.main-btn{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  background:#7b2cff;
  color:white;
  font-size:16px;
}

.social-btn{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:12px;
  background:#eee;
  font-size:15px;
}

.welcome{
  padding:20px;
  border-radius:20px;
  color:white;
  background:linear-gradient(135deg,#7b2cff,#ff3cac);
  margin-bottom:18px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:#f6f3ff;
  padding:15px 5px;
  border-radius:14px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:20px;
  margin-bottom:5px;
}

.room{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.room:last-child{
  border-bottom:0;
}

.room-icon{
  width:55px;
  height:55px;
  border-radius:15px;
  background:linear-gradient(135deg,#7b2cff,#ff3cac);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:25px;
}

.profile-cover{
  height:130px;
  border-radius:18px;
  background:linear-gradient(135deg,#7b2cff,#ff3cac);
}

.profile-photo{
  width:90px;
  height:90px;
  margin:-45px auto 10px;
  border:5px solid white;
  border-radius:50%;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

.profile{
  text-align:center;
}

.action-btn{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  background:#f1edff;
  color:#5d20c9;
  font-size:16px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  height:70px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -3px 15px rgba(0,0,0,.1);
}

.nav-btn{
  background:none;
  color:#777;
  font-size:12px;
}

.nav-btn span{
  display:block;
  font-size:23px;
  margin-bottom:3px;
}

.nav-btn.active{
  color:#7b2cff;
}

.message{
  padding:15px;
  border-radius:15px;
  background:#f6f6f6;
  margin-bottom:10px;
}

.settings-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 0;
  border-bottom:1px solid #eee;
}

.settings-item:last-child{
  border-bottom:0;
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div class="app">

<!-- تسجيل الدخول -->
<section id="loginPage" class="page active login">

  <div class="logo">⭐</div>

  <h1>أهلاً بك</h1
