<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامج ترفيه وتسلية</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f6fa;
  color:#222;
  padding-bottom:75px;
}

button{
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.top{
  height:65px;
  background:linear-gradient(135deg,#32106b,#1769aa);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.coins{
  background:rgba(255,255,255,.15);
  padding:10px 14px;
  border-radius:20px;
}

.page{
  display:none;
  padding:18px;
}

.page.active{
  display:block;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#32106b,#1769aa);
}

.login-box{
  background:white;
  width:100%;
  max-width:400px;
  padding:28px;
  border-radius:25px;
  text-align:center;
}

.login-box h1{
  margin-bottom:10px;
}

.login-box p{
  color:#777;
  margin-bottom:20px;
}

.input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:12px;
  font-size:16px;
}

.main-btn{
  width:100%;
  padding:14px;
  background:#32106b;
  color:white;
  border-radius:12px;
  font-size:16px;
}

.profile-head{
  text-align:center;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#eee;
  margin:auto;
  display:flex;
align-items:center;
  justify-content:center;
}

.profile-info{
  text-align:center;
  margin-top:15px;
}

.profile-info h2{
  margin:8px 0;
  font-size:22px;
}

.profile-info p{
  margin:5px 0;
  color:#777;
  font-size:14px;
}

.profile-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.profile-actions button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  font-size:15px;
  cursor:pointer;
}

.edit-btn{
  background:#32106b;
  color:white;
}

.follow-btn{
  background:#eee;
  color:#333;
}

.stats{
  display:flex;
  justify-content:space-around;
  margin:20px 0;
  padding:15px 0;
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
}

.stat{
  text-align:center;
}

.stat strong{
  display:block;
  font-size:18px;
}

.stat span{
  color:#777;
  font-size:13px;
}

.cover{
  width:100%;
  height:150px;
  border-radius:15px;
  background:#eee;
  object-fit:cover;
  margin-bottom:15px;
}

.card{
  background:white;
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.section-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.room{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.room:last-child{
  border-bottom:none;
}

.room-icon{
  width:55px;
  height:55px;
  border-radius:15px;
  object-fit:cover;
  background:#eee;
}

.room-info{
  flex:1;
}

.room-info h3{
  margin:0 0 5px;
  font-size:16px;
}

.room-info p{
  margin:0;
  color:#777;
  font-size:13px;
}

.room-btn{
  padding:9px 14px;
  border:none;
  border-radius:10px;
  background:#32106b;
  color:white;
  font-size:13px;
}

.status{
  padding:12px;
  border-radius:12px;
  background:#f7f7f7;
  margin-bottom:10px;
}

.status p{
  margin:0;
  font-size:14px;
}

.coins{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px;
  background:#fff8df;
  border-radius:12px;
  margin-bottom:15px;
}

.coins strong{
  font-size:18px;
}

.gift{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.gift-icon{
  width:50px;
  height:50px;
  border-radius:12px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.gift-info{
  flex:1;
}

.gift-info strong{
  display:block;
  margin-bottom:4px;
}

.gift-info span{
  color:#777;
  font-size:13px;
}

.family{
  padding:15px;
  border-radius:15px;
  background:#f7f7f7;
  margin-bottom:15px;
}

.family h3{
  margin:0 0 8px;
}

.family p{
  margin:5px 0;
  color:#777;
  font-size:14px;
}

.family-btn{
  width:100%;
  padding:13px;
  border:none;
  border-radius:12px;
  background:#32106b;
  color:white;
  font-size:16px;
  margin-top:10px;
}

.settings-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.settings-item:last-child{
  border-bottom:none;
}

.settings-item span{
  color:#555;
}

.settings-item button{
  border:none;
  background:#eee;
  padding:8px 12px;
  border-radius:10px;
  }}

.settings-item button{
  color:#32106b;
  font-size:14px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:space-around;
  border-top:1px solid #eee;
  z-index:100;
}

.bottom-nav button{
  border:none;
  background:none;
  font-size:13px;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.bottom-nav button.active{
  color:#32106b;
  font-weight:bold;
}

.page{
  display:none;
  padding-bottom:85px;
}

.page.active{
  display:block;
}

.home-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.home-header h2{
  margin:0;
  font-size:22px;
}

.notification-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#eee;
  font-size:20px;
}

.search-box{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:15px;
}

.search-box input{
  flex:1;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
}

.user-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.user-avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.user-details{
  flex:1;
}

.user-details h3{
  margin:0 0 4px;
  font-size:16px;
}

.user-details span{
  color:#777;
  font-size:13px;
}

.online{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#28a745;
}

.chat-message{
  display:flex;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.chat-message .user-avatar{
  width:45px;
  height:45px;
  font-size:18px;
}

.message-content{
  flex:1;
}

.message-content strong{
  display:block;
  margin-bottom:4px;
}

.message-content p{
  margin:0;
  color:#666;
  font-size:14px;
}

.message-time{
  color:#999;
  font-size:11px;
}

.empty-state{
  text-align:center;
  padding:40px 20px;
  color:#777;
}

.empty-state-icon{
  font-size:50px;
  margin-bottom:10px;
}

.create-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#32106b;
  color:white;
  font-size:16px;
  margin-top:15px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
  box-sizing:border-box;
}

.form-group textarea{
  min-height:100px;
  resize:vertical;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  align-items:center;
  justify-content:center;
  z-index:200;
  padding:20px;
}

.modal.active{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:18px;
  padding:20px;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-header h3{
  margin:0;
}

.close-btn{
  border:none;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:18px;
}

@media(max-width:480px){
  .container{
    padding:12px;
  }

  .card{
    padding:13px;
  }

  .home-header h2{
    font-size:20px;
  }/* نهاية تنسيق التطبيق */

.toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:12px 18px;
  border-radius:12px;
  font-size:14px;
  display:none;
  z-index:300;
}

.toast.show{
  display:block;
}

.hidden{
  display:none !important;
}

.text-center{
  text-align:center;
}

.mt-10{
  margin-top:10px;
}

.mt-15{
  margin-top:15px;
}

.mb-10{
  margin-bottom:10px;
}

.mb-15{
  margin-bottom:15px;
  }
  }
